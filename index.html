<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anchor</title>
<meta name="description" content="Household maintenance — what needs doing, and when you last did it.">
<meta name="theme-color" content="#f7f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anchor">
<link rel="stylesheet" href="css/styles.css">
<script>
  /* Applied before first paint to avoid a flash. Deliberately not a module: modules are
     deferred, and this has to run now. It reads the same key js/persist.js writes. */
  try{
    var t = localStorage.getItem('anchor:theme');
    if(t) document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
</script>
</head>
<body>
<header class="topbar">
  <h1 class="brand">Anchor</h1>
  <button class="btn-quiet" id="themeToggle" type="button" aria-label="Switch theme">◐</button>
</header>

<div id="chrome"></div>
<main id="app" aria-live="polite"></main>

<noscript><p class="warning">Anchor needs JavaScript.</p></noscript>

<script type="module" src="js/app.js"></script>
</body>
</html>
