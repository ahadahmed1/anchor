<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Anchor</title>
<meta name="description" content="Track software projects and recurring life maintenance — car, home, health, finances and more — in one offline-first ledger.">
<meta name="theme-color" id="themeColor" content="#0F1218">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Anchor">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<script src="js/storage.js"></script>
<script>
  /* Apply the saved theme before first paint so there is no flash of the wrong one. */
  (function(){
    var theme = Store.getSync('theme');
    if(!theme) theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', theme);
    document.getElementById('themeColor').setAttribute('content', theme === 'light' ? '#F5F6F8' : '#0F1218');
  })();
</script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <div class="brand-dot"></div>
        <h1>Anchor</h1>
      </div>
      <div class="brand-sub">DOMAIN &rarr; GROUP &rarr; ITEM</div>
    </div>
    <div class="topbar-actions">
      <div class="view-switch" id="topViewSwitch">
        <button class="on" data-top-view="domains">Domains</button>
        <button data-top-view="tasks">Tasks</button>
      </div>
      <button class="install-btn" id="installBtn" hidden>Install</button>
      <button class="sync-btn" id="syncBtn">Sync</button>
      <div class="seg-toggle" id="themeToggle">
        <button class="seg-opt" data-theme-opt="dark">dark</button>
        <button class="seg-opt" data-theme-opt="light">light</button>
      </div>
      <button class="new-btn" id="newBtn">+ New domain</button>
    </div>
  </div>

  <div class="quickadd" id="quickAdd">
    <span class="qa-label">Quick add</span>
    <select class="qa-select" id="qaDomain"></select>
    <select class="qa-select" id="qaGroup"></select>
    <div class="seg-toggle mini" id="qaKindToggle">
      <button class="seg-opt active" data-qa-kind="task">one-off</button>
      <button class="seg-opt" data-qa-kind="recurring">recurring</button>
    </div>
    <input class="qa-input" type="text" id="qaName" placeholder="Item name...">
    <button class="qa-btn" id="qaAdd">Add</button>
    <button class="qa-details-btn" id="qaDetails">+ details</button>
  </div>

  <div id="domainsWidgets">
    <div class="ledger" id="ledgerStrip"></div>

    <div class="filters">
      <div class="tab-group" id="healthTabs">
        <button class="tab active" data-filter="all">all</button>
        <button class="tab" data-filter="attention">attention</button>
        <button class="tab" data-filter="on_track">on track</button>
        <button class="tab" data-filter="done">done</button>
      </div>
      <div class="seg-toggle" id="viewToggle">
        <button class="seg-opt active" data-global-view="list">list</button>
        <button class="seg-opt" data-global-view="board">board</button>
      </div>
      <input class="search-input" id="searchInput" type="text" placeholder="search...">
    </div>

    <div class="chip-row" id="catChips"></div>
  </div>

  <div class="grid" id="grid">
    <div class="loading">loading&hellip;</div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="modalRoot"></div>
<div id="syncRoot"></div>

<script src="js/sync.js"></script>
<script src="js/app.js"></script>
</body>
</html>
